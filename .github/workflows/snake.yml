name: Generate Snake SVG

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual run from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate GitHub Contribution Snake (SVG only)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zs-3
          outputs: |
            dist/github-snake.svg?color_snake=%2322d3ee&color_dots=%231c2030,%234c3a9e,%237c5cf0,%23a78bfa,%2322d3ee

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build profile SVG (live stats + snake embedded)
        run: python scripts/build_profile.py
        env:
          PROFILE_USER: zs-3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push SVGs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add dist/github-snake.svg assets/profile.svg
          git commit -m "🐍 Update snake + profile" || echo "No changes to commit"
          git push
